<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Survive. Heal. Rise. | 6-Month Community Series</title>

    <meta name="description"
          content="Survive. Heal. Rise. is a six-month community series focused on healing, resilience, faith, creativity, service, and personal growth in St. Cloud, Minnesota.">

    <meta name="author" content="Emmanuel Modi">

    <meta name="robots" content="index, follow">

    <meta name="theme-color" content="#0a0e1a">

    <!-- Open Graph / Social Sharing -->
    <meta property="og:type" content="website">
    <meta property="og:title"
          content="Survive. Heal. Rise. | 6-Month Community Series">
    <meta property="og:description"
          content="From Trauma to Triumph. From Silence to Purpose. A six-month community series focused on healing, resilience, faith, creativity, service, and personal growth.">
    <meta property="og:url"
          content="https://emmamodi551-glitch.github.io/ministry/">
    <meta property="og:site_name"
          content="Survive. Heal. Rise.">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Cinzel:wght@600;700;800&display=swap"
          rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>

        /* =====================================================
           RESET
        ===================================================== */

        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: "Plus Jakarta Sans", sans-serif;
            background: #0a0e1a;
            color: #ffffff;
            line-height: 1.6;
            overflow-x: hidden;
        }

        img,
        video {
            max-width: 100%;
            display: block;
        }

        a {
            color: inherit;
        }

        section {
            scroll-margin-top: 90px;
        }

        :root {
            --bg-dark: #0a0e1a;
            --card-bg: #111827;
            --card-dark: #0f172a;
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --gold: #d97706;
            --gold-light: #fcd34d;
            --text: #ffffff;
            --muted: #94a3b8;
            --border: #1e293b;
            --radius: 14px;
            --glow: rgba(99, 102, 241, 0.25);
        }

        .brand-font {
            font-family: "Cinzel", serif;
        }


        /* =====================================================
           ACCESSIBILITY
        ===================================================== */

        .skip-link {
            position: fixed;
            top: -100px;
            left: 15px;
            z-index: 99999;
            background: #ffffff;
            color: #0a0e1a;
            padding: 12px 18px;
            border-radius: 8px;
            font-weight: 800;
            text-decoration: none;
        }

        .skip-link:focus {
            top: 15px;
            outline: 3px solid var(--gold-light);
        }

        :focus-visible {
            outline: 3px solid var(--gold-light);
            outline-offset: 3px;
        }

        .visually-hidden {
            position: absolute !important;
            width: 1px !important;
            height: 1px !important;
            padding: 0 !important;
            margin: -1px !important;
            overflow: hidden !important;
            clip: rect(0, 0, 0, 0) !important;
            white-space: nowrap !important;
            border: 0 !important;
        }


        /* =====================================================
           HEADER / NAVIGATION
        ===================================================== */

        header {
            position: sticky;
            top: 0;
            z-index: 1000;
            width: 100%;
            background: rgba(10, 14, 26, 0.96);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
        }

        .navbar {
            width: min(1200px, 100%);
            margin: auto;
            padding: 14px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 9px;
            text-decoration: none;
            flex-shrink: 0;
        }

        .logo img {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--gold-light);
        }

        .logo-text {
            font-family: "Cinzel", serif;
            font-size: 0.8rem;
            font-weight: 800;
            white-space: nowrap;
        }

        .nav-links {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            flex-wrap: wrap;
            gap: 8px;
            list-style: none;
        }

        .nav-links a {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 8px 10px;
            color: var(--muted);
            text-decoration: none;
            font-size: 0.78rem;
            font-weight: 600;
            border-radius: 7px;
            transition: 0.25s ease;
        }

        .nav-links a:hover {
            color: #ffffff;
            background: rgba(255,255,255,0.05);
        }

        .nav-links .ecosystem-link {
            border: 1px solid var(--border);
            color: #a5b4fc;
        }

        .nav-links .cta {
            background: var(--primary);
            color: #ffffff;
            box-shadow: 0 4px 15px var(--glow);
        }

        .nav-links .cta:hover {
            background: var(--primary-hover);
        }


        /* =====================================================
           HERO
        ===================================================== */

        .hero {
            padding: 100px 20px 85px;
            text-align: center;
            background:
                radial-gradient(
                    circle at top,
                    rgba(99,102,241,0.2),
                    transparent 65%
                );
        }

        .hero-content {
            width: min(900px, 100%);
            margin: auto;
        }

        .hero-tag {
            display: inline-block;
            margin-bottom: 25px;
            padding: 7px 16px;
            border-radius: 50px;
            background: rgba(217,119,6,0.15);
            border: 1px solid rgba(217,119,6,0.4);
            color: var(--gold-light);
            font-size: 0.8rem;
            font-weight: 800;
            text-transform: uppercase;
        }

        .hero h1 {
            font-size: clamp(2.4rem, 7vw, 4rem);
            line-height: 1.1;
            margin-bottom: 12px;
            font-weight: 800;
        }

        .highlight {
            background: linear-gradient(
                135deg,
                #fcd34d,
                #d97706
            );
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            color: #a5b4fc;
            font-size: clamp(1.2rem, 3vw, 1.6rem);
            margin-bottom: 20px;
        }

        .tagline {
            max-width: 760px;
            margin: 0 auto 30px;
            color: var(--muted);
            font-size: 1.05rem;
        }

        .hero-buttons {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 12px;
        }

        .btn-primary,
        .btn-secondary {
            display: inline-flex;
            justify-content: center;
            align-items: center;
            min-height: 48px;
            padding: 12px 22px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: 700;
            transition: 0.25s ease;
        }

        .btn-primary {
            background: var(--primary);
            color: #ffffff;
            box-shadow: 0 4px 20px var(--glow);
        }

        .btn-primary:hover {
            background: var(--primary-hover);
            transform: translateY(-2px);
        }

        .btn-secondary {
            background: #161e2e;
            border: 1px solid var(--border);
        }

        .btn-secondary:hover {
            background: #1e293b;
        }


        /* =====================================================
           GENERAL SECTIONS
        ===================================================== */

        .section {
            width: min(1200px, 100%);
            margin: auto;
            padding: 80px 24px;
        }

        .section-header {
            max-width: 780px;
            margin: 0 auto 45px;
            text-align: center;
        }

        .section-header h2 {
            font-size: clamp(2rem, 5vw, 2.6rem);
            margin-bottom: 10px;
        }

        .section-header p {
            color: var(--muted);
        }


        /* =====================================================
           CURRICULUM
        ===================================================== */

        .timeline-container {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 20px;
        }

        .month-card {
            display: flex;
            flex-direction: column;
            min-width: 0;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 25px;
            transition: 0.25s ease;
        }

        .month-card:hover {
            transform: translateY(-4px);
            border-color: var(--primary);
            box-shadow: 0 12px 30px rgba(0,0,0,0.3);
        }

        .month-badge {
            align-self: flex-start;
            margin-bottom: 14px;
            padding: 5px 10px;
            border-radius: 6px;
            background: rgba(99,102,241,0.15);
            border: 1px solid rgba(99,102,241,0.3);
            color: #a5b4fc;
            font-size: 0.75rem;
            font-weight: 800;
        }

        .month-card h3 {
            margin-bottom: 4px;
            font-size: 1.25rem;
        }

        .theme-sub {
            color: var(--gold-light);
            font-size: 0.8rem;
            margin-bottom: 14px;
        }

        .description {
            color: var(--muted);
            font-size: 0.92rem;
            margin-bottom: 18px;
        }

        .scripture-box {
            margin-top: auto;
            padding: 12px;
            background: rgba(0,0,0,0.25);
            border-left: 3px solid var(--primary);
            border-radius: 0 8px 8px 0;
            color: #e2e8f0;
            font-size: 0.85rem;
            font-style: italic;
        }

        .scripture-box .ref {
            display: block;
            margin-top: 5px;
            color: #a5b4fc;
            font-style: normal;
            font-weight: 700;
        }


        /* =====================================================
           EXPECT
        ===================================================== */

        .expect-grid {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 18px;
        }

        .expect-card {
            padding: 25px 18px;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            text-align: center;
        }

        .expect-card i {
            margin-bottom: 12px;
            color: var(--primary);
            font-size: 2rem;
        }

        .expect-card h4 {
            margin-bottom: 7px;
        }

        .expect-card p {
            color: var(--muted);
            font-size: 0.87rem;
        }


        /* =====================================================
           EVENT
        ===================================================== */

        .event-box {
            display: grid;
            grid-template-columns: 1.5fr 1fr;
            gap: 30px;
            align-items: center;
            padding: 40px;
            background: linear-gradient(
                135deg,
                #0f172a,
                #111827
            );
            border: 1px solid var(--border);
            border-radius: var(--radius);
        }

        .event-details h3 {
            font-size: 2rem;
            margin-bottom: 12px;
        }

        .event-details p {
            color: var(--muted);
        }

        .event-list {
            list-style: none;
            margin-top: 20px;
        }

        .event-list li {
            display: flex;
            gap: 10px;
            margin-bottom: 12px;
            color: #e2e8f0;
        }

        .event-list i {
            color: var(--primary);
            margin-top: 4px;
        }

        .attend-box {
            padding: 25px;
            text-align: center;
            background: rgba(0,0,0,0.25);
            border: 1px solid var(--border);
            border-radius: var(--radius);
        }

        .attend-box h4 {
            margin-bottom: 15px;
        }

        .attend-list {
            list-style: none;
            text-align: left;
            margin-bottom: 20px;
        }

        .attend-list li {
            margin-bottom: 8px;
            color: var(--muted);
            font-size: 0.88rem;
        }

        .attend-list i {
            color: var(--gold-light);
            margin-right: 6px;
        }

        .admission-badge {
            padding: 12px;
            margin-bottom: 15px;
            background: var(--primary);
            border-radius: 8px;
            font-weight: 800;
        }


        /* =====================================================
           MEDIA
        ===================================================== */

        .media-section {
            background: #f8fafc;
            color: #1f2937;
        }

        .media-section .section-header h2 {
            color: #111827;
        }

        .media-section .section-header p {
            color: #64748b;
        }

        .media-grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 25px;
        }

        .media-card {
            display: flex;
            flex-direction: column;
            min-width: 0;
            overflow: hidden;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.08);
        }

        .media-content {
            display: flex;
            flex-direction: column;
            flex: 1;
            padding: 25px;
        }

        .media-card h3 {
            margin: 12px 0 8px;
            color: #111827;
            font-size: 1.35rem;
        }

        .media-card p {
            color: #475569;
            font-size: 0.92rem;
            line-height: 1.6;
        }

        .media-badge {
            align-self: flex-start;
            padding: 4px 9px;
            border-radius: 5px;
            background: #eef2ff;
            color: #4338ca;
            font-size: 0.72rem;
            font-weight: 800;
            text-transform: uppercase;
        }

        .media-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            align-self: flex-start;
            margin-top: auto;
            padding: 10px 18px;
            background: #4f46e5;
            color: #ffffff;
            border-radius: 7px;
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 700;
        }

        .media-video {
            width: 100%;
            background: #000;
        }


        /* =====================================================
           BOOK SERIES
           IMPORTANT: EACH BOOK CARD OWNS ITS BUTTON
        ===================================================== */

        .books-section {
            background: #f9f9f9;
            color: #333333;
        }

        .books-section .section-header h2 {
            color: #1a1a1a;
        }

        .books-section .section-header p {
            color: #666666;
        }

        .books-grid {
            width: min(1200px, 100%);
            margin: auto;
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 24px;
            align-items: stretch;
        }

        .book-card {
            position: relative;
            min-width: 0;
            display: flex;
            flex-direction: column;
            height: 100%;
            overflow: hidden;
            background: #ffffff;
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            box-shadow: 0 5px 18px rgba(0,0,0,0.07);
        }

        .book-cover {
            width: 100%;
            aspect-ratio: 3 / 4;
            object-fit: cover;
            background: #e5e7eb;
        }

        .book-content {
            display: flex;
            flex-direction: column;
            flex: 1;
            padding: 24px;
        }

        .book-number {
            color: #b08a20;
            font-size: 0.75rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .book-card h3 {
            margin: 8px 0;
            color: #111827;
            font-size: 1.3rem;
        }

        .book-card p {
            margin-bottom: 20px;
            color: #64748b;
            font-size: 0.9rem;
        }

        .book-button {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            min-height: 44px;
            margin-top: auto;
            padding: 10px 14px;
            border-radius: 8px;
            background: #111827;
            color: #ffffff;
            text-decoration: none;
            font-weight: 700;
            font-size: 0.85rem;
        }

        .book-button:hover {
            background: #374151;
        }

        .book-button.coming-soon {
            background: #e5e7eb;
            color: #4b5563;
            cursor: default;
        }


        /* =====================================================
           SPEAKER / ABOUT
        ===================================================== */

        .speaker-card {
            display: grid;
            grid-template-columns: 280px minmax(0, 1fr);
            gap: 35px;
            align-items: center;
            padding: 35px;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: var(--radius);
        }

        .speaker-avatar {
            min-height: 280px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: linear-gradient(
                135deg,
                rgba(99,102,241,0.25),
                #111827
            );
            border: 1px solid var(--border);
            border-radius: var(--radius);
            text-align: center;
        }

        .speaker-avatar i {
            margin-bottom: 15px;
            color: var(--primary);
            font-size: 3.5rem;
        }

        .speaker-info h3 {
            margin
